[tool.poetry]
name = "agencia-seo"
version = "0.1.0"
description = "GEO-SEO CRM API and tools"
authors = ["Agustin <agustin@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
beautifulsoup4 = "^4.12.0"
requests = "^2.32.4"
lxml = "^6.0.2"
playwright = "^1.56.0"
pillow = "^12.1.0"
urllib3 = "^2.6.3"
validators = "^0.22.0"
rich = "^13.0.0"
fastapi = {extras = ["standard"], version = "^0.115.0"}
pymongo = "^4.17.0"
python-dotenv = "^1.2.2"
wappalyzer = "^2.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
# tests/ mirrors the backend/app/ package tree; `.` makes `backend.app...`
# importable. importlib mode lets two mirrored test files share a basename
# (tests/services/test_audit.py vs tests/api/endpoints/test_audit.py) without
# sprinkling __init__.py through tests/.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Defaults (E, F) plus import sorting (I).
extend-select = ["I"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.15.20,<0.16.0)"
]
