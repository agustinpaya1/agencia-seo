[tool.poetry]
name = "agencia-seo"
version = "0.1.0"
description = "GEO-SEO CRM API and tools"
authors = ["Agustin <agustin@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
beautifulsoup4 = "^4.12.0"
requests = "^2.32.4"
lxml = "^6.0.2"
playwright = "^1.56.0"
pillow = "^12.1.0"
urllib3 = "^2.6.3"
validators = "^0.22.0"
rich = "^13.0.0"
fastapi = {extras = ["standard"], version = "^0.115.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.fastapi]
entrypoint = "backend.app.main:app"
